name: Build and deploy SID-enabled VirtualC64Web

on:
  push:
    branches: [sid-event-hook]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 3.1.64
      - name: Configure WebAssembly build
        run: emcmake cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build emulator
        run: cmake --build build --target vc64 --parallel 2
      - name: Assemble Pages site
        run: |
          mkdir -p dist
          cp build/vc64.html dist/index.html
          cp build/vc64.js build/vc64.wasm build/sw.js dist/
          cp run.html manifest.json dist/
          cp -R js css img roms sounds dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
